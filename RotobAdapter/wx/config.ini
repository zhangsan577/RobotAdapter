; wx_cashier_proxy.dll / wx_relay_service.exe shared config
; Put this file next to the DLL / EXE and rename it to config.ini.

[target]
; Target process name. The launcher scans this process and injects the DLL.
process_name=wxCashier.exe
; DLL file name, located next to the launcher EXE.
dll_name=wx_cashier_proxy.dll

[sniff]
; Port filter: 0 = all ports, 11015 = wxCashier protocol port.
filter_port=11015
; Max payload bytes shown in logs. Larger payloads are truncated.
max_bytes=262144

[business]
; console_id used by proxy_dll for active business requests.
; This must match the cashier console id accepted by the server.
console_id=1


[http]
port=9100
threads=8

[poll]
enabled=1
interval_ms=1000
sink_url=http://127.0.0.1:8053